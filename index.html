<!DOCTYPE html>
<html>
<head>
    <title>Bank Account Management</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; }
        .container { max-width: 450px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-container { text-align: center; margin-top: 20px; }
        button, .btn-link { padding: 10px 18px; background: #1e3a8a; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-link { background: #4b5563; display: inline-block; margin-left: 10px; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Account Registration</h2>
        <form action="accounts" method="POST">
            <div class="form-group">
                <label>Account Number:</label>
                <input type="text" name="accNum" placeholder="e.g. ACC1003" required />
            </div>
            <div class="form-group">
                <label>Account Holder Name:</label>
                <input type="text" name="holderName" placeholder="e.g. Tirth Bharodiya" required />
            </div>
            <div class="form-group">
                <label>Account Type:</label>
                <select name="accType">
                    <option value="Savings">Savings</option>
                    <option value="Checking">Checking</option>
                </select>
            </div>
            <div class="form-group">
                <label>Initial Balance ($):</label>
                <input type="number" step="0.01" name="balance" placeholder="e.g. 5000.00" required />
            </div>
            <div class="btn-container">
                <button type="submit">Create Account</button>
                <a href="accounts" class="btn-link">View All Accounts</a>
            </div>
        </form>
    </div>
</body>
</html>
